name: CPU reference checks
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'transformers==4.57.6'
      - run: python test_rmsnorm.py
      - run: python test_attention.py
      - run: python test_gelu.py
      - run: python test_fused_ln.py
      - run: python benchmark.py --device cpu --rows 3 --width 257 --warmup 1 --repeats 2 --iterations 2
